<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jupyter Lab Pod Manager</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --card: #1e2235;
      --border: #2d3148;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f51d8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    /* Layout */
    .page { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    /* Header */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 1.1rem; font-weight: 700; color: var(--primary); letter-spacing: 0.02em; }
    .logo span { color: var(--text); font-weight: 400; margin-left: 0.5rem; font-size: 0.85rem; }
    .user-info { display: flex; align-items: center; gap: 0.75rem; }
    .badge {
      padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .badge-admin { background: rgba(99,102,241,0.2); color: var(--primary); }
    .badge-user  { background: rgba(34,197,94,0.15); color: var(--success); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer;
      font-size: 0.875rem; font-weight: 500; transition: all 0.15s; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
    .btn-success:hover:not(:disabled) { background: rgba(34,197,94,0.25); }
    .btn-danger { background: rgba(239,68,68,0.12); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.22); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }
    .btn-warning { background: rgba(245,158,11,0.12); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
    .btn-warning:hover:not(:disabled) { background: rgba(245,158,11,0.22); }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.5rem;
    }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text); }

    /* Login */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 60% 40%, rgba(99,102,241,0.08) 0%, transparent 70%);
    }
    .login-card {
      width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
      border-radius: 1rem; padding: 2.5rem 2rem;
    }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo .icon { font-size: 3rem; }
    .login-logo h1 { font-size: 1.3rem; font-weight: 700; margin-top: 0.5rem; }
    .login-logo p { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; }
    .form-input {
      width: 100%; padding: 0.6rem 0.85rem; background: var(--surface); border: 1px solid var(--border);
      border-radius: 0.5rem; color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--primary); }
    .login-btn { width: 100%; padding: 0.7rem; margin-top: 0.5rem; font-size: 0.95rem; }
    .error-msg { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: var(--danger);
      padding: 0.6rem 0.85rem; border-radius: 0.5rem; font-size: 0.85rem; margin-bottom: 1rem; }

    /* Tabs */
    .tabs { display: flex; gap: 0.25rem; background: var(--surface); border-radius: 0.6rem; padding: 0.3rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
    .tab { padding: 0.5rem 1rem; border-radius: 0.45rem; border: none; background: transparent; color: var(--muted);
      font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .tab.active { background: var(--card); color: var(--text); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { padding: 0.65rem 1rem; text-align: left; color: var(--muted); font-weight: 500; font-size: 0.78rem;
      text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid rgba(45,49,72,0.6); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* Status pills */
    .status {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;
    }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-running  { background: rgba(34,197,94,0.12); color: var(--success); }
    .status-creating { background: rgba(59,130,246,0.12); color: var(--info); }
    .status-queued   { background: rgba(245,158,11,0.12); color: var(--warning); }
    .status-error, .status-timeout { background: rgba(239,68,68,0.12); color: var(--danger); }
    .status-unknown  { background: rgba(148,163,184,0.12); color: var(--muted); }
    .status-ready    { background: rgba(34,197,94,0.12); color: var(--success); }

    /* Stat cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.2rem 1.5rem; }
    .stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
    .stat-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }

    /* Session card (user view) */
    .session-hero {
      text-align: center; padding: 3rem 2rem;
      background: radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.1) 0%, transparent 70%);
    }
    .session-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .session-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
    .session-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .session-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }

    /* Progress / spinner */
    .spinner {
      display: inline-block; width: 16px; height: 16px; border: 2px solid transparent;
      border-top-color: currentColor; border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Queue info */
    .queue-info {
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);
      border-radius: 0.6rem; padding: 1rem 1.5rem; margin-top: 1rem; text-align: left;
    }
    .queue-info dt { font-size: 0.78rem; color: var(--muted); margin-top: 0.6rem; }
    .queue-info dd { font-size: 0.95rem; font-weight: 600; color: var(--warning); }

    /* Load test */
    .load-section { display: flex; flex-direction: column; gap: 1rem; }
    .load-counter {
      font-size: 3rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums;
    }
    .load-log {
      background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem;
      padding: 1rem; max-height: 280px; overflow-y: auto; font-family: 'Courier New', monospace;
      font-size: 0.78rem; color: var(--muted); line-height: 1.6;
    }
    .log-ok  { color: var(--success); }
    .log-err { color: var(--danger); }
    .log-ts  { color: var(--border); margin-right: 0.5rem; }

    /* Refresh bar */
    .refresh-bar { display: flex; align-items: center; gap: 0.75rem; justify-content: flex-end; margin-bottom: 0.75rem; }
    .refresh-bar span { font-size: 0.8rem; color: var(--muted); }

    /* Responsive */
    @media (max-width: 640px) {
      .page { padding: 1rem; }
      header { padding: 0.75rem 1rem; }
      .tabs { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
'use strict';

// ─── State ────────────────────────────────────────────────────────────────────

let S = {
  token: null, username: null, role: null,
  view: 'login',          // 'login' | 'user' | 'admin'
  session: null,          // current user session object
  adminTab: 'sessions',   // 'sessions' | 'nodes' | 'pods' | 'usage' | 'load'
  adminData: {},          // { sessions, nodes, pods, usage }
  loadCount: 0,
  loadLog: [],
  pollTimer: null,
  refreshTimer: null,
};

function persistAuth() {
  localStorage.setItem('jlpm', JSON.stringify({ token: S.token, username: S.username, role: S.role }));
}

function restoreAuth() {
  try {
    const raw = localStorage.getItem('jlpm');
    if (!raw) return;
    const p = JSON.parse(raw);
    S.token = p.token; S.username = p.username; S.role = p.role;
    S.view = p.role === 'admin' ? 'admin' : 'user';
  } catch (_) {}
}

function logout() {
  clearTimers();
  localStorage.removeItem('jlpm');
  S = { ...S, token: null, username: null, role: null, view: 'login', session: null, adminData: {}, loadCount: 0, loadLog: [] };
  render();
}

// ─── API ──────────────────────────────────────────────────────────────────────

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (S.token) opts.headers['Authorization'] = `Bearer ${S.token}`;
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (res.status === 401) { logout(); throw new Error('세션이 만료되었습니다. 다시 로그인해주세요.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `오류 ${res.status}`);
  return data;
}

// ─── Timers ───────────────────────────────────────────────────────────────────

function clearTimers() {
  if (S.pollTimer)   { clearInterval(S.pollTimer);   S.pollTimer = null; }
  if (S.refreshTimer){ clearInterval(S.refreshTimer); S.refreshTimer = null; }
}

// ─── User Logic ───────────────────────────────────────────────────────────────

async function loadUserSession() {
  try {
    const data = await api('GET', '/sessions');
    const sessions = Object.values(data.sessions || {});
    S.session = sessions.length > 0 ? sessions[0] : null;
  } catch (_) { S.session = null; }
  renderUserContent();
}

async function createSession() {
  btn('btn-create', true);
  try {
    const data = await api('POST', `/users/${encodeURIComponent(S.username)}/session`);
    S.session = { session_id: data.session_id, status: data.status, access_url: data.launch_url, username: S.username, queue_position: data.queue_position, estimated_wait_seconds: data.estimated_wait_seconds };
    renderUserContent();
    startPoll();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn('btn-create', false);
  }
}

async function deleteSession() {
  if (!S.session) return;
  if (!confirm('세션을 삭제하시겠습니까?')) return;
  btn('btn-delete', true);
  try {
    await api('DELETE', `/session/${S.session.session_id}`);
    S.session = null;
    stopPoll();
    renderUserContent();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn('btn-delete', false);
  }
}

async function pollSession() {
  if (!S.session) { stopPoll(); return; }
  try {
    const data = await api('GET', `/session/${S.session.session_id}`);
    const prevStatus = S.session.status;
    S.session = { ...S.session, ...data };
    if (data.status === 'running' && prevStatus !== 'running') {
      stopPoll();
      showToast('Jupyter Lab이 준비되었습니다! 🎉', 'success');
    }
    renderUserContent();
  } catch (_) {}
}

function startPoll() {
  stopPoll();
  if (S.session && S.session.status !== 'running') {
    S.pollTimer = setInterval(pollSession, 3000);
  }
}

function stopPoll() {
  if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
}

// ─── Admin Logic ──────────────────────────────────────────────────────────────

async function loadAdminTab(tab) {
  S.adminTab = tab;
  renderAdminContent();
  await fetchAdminData(tab);
  renderAdminContent();
  startAdminRefresh(tab);
}

function startAdminRefresh(tab) {
  if (S.refreshTimer) { clearInterval(S.refreshTimer); S.refreshTimer = null; }
  if (tab === 'load') return;
  S.refreshTimer = setInterval(async () => {
    await fetchAdminData(S.adminTab);
    renderAdminContent();
  }, 5000);
}

async function fetchAdminData(tab) {
  try {
    if (tab === 'sessions') {
      S.adminData.sessions = await api('GET', '/sessions');
    } else if (tab === 'nodes') {
      S.adminData.nodes = await api('GET', '/admin/system/nodes');
    } else if (tab === 'pods') {
      S.adminData.pods = await api('GET', '/admin/system/pods');
    } else if (tab === 'usage') {
      S.adminData.usage = await api('GET', '/admin/usage');
    }
  } catch (e) {
    S.adminData.error = e.message;
  }
}

async function adminStopSession(sessionId) {
  if (!confirm(`세션 ${sessionId}를 중지하시겠습니까?`)) return;
  try {
    await api('POST', `/admin/session/${sessionId}/stop`);
    showToast('세션이 중지되었습니다.', 'success');
    await fetchAdminData('sessions');
    renderAdminContent();
  } catch (e) { showToast(e.message, 'error'); }
}

async function adminDeleteSession(sessionId) {
  if (!confirm(`세션 ${sessionId}를 삭제하시겠습니까?`)) return;
  try {
    await api('DELETE', `/admin/session/${sessionId}`);
    showToast('세션이 삭제되었습니다.', 'success');
    await fetchAdminData('sessions');
    renderAdminContent();
  } catch (e) { showToast(e.message, 'error'); }
}

async function generateLoad(times = 1) {
  const results = await Promise.allSettled(
    Array.from({ length: times }, () => api('POST', '/load/generate'))
  );
  const ts = new Date().toLocaleTimeString();
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') {
      S.loadCount++;
      S.loadLog.push({ ts, ok: true, msg: `[${i+1}] fib(35)=${r.value.fibonacci_35}` });
    } else {
      S.loadLog.push({ ts, ok: false, msg: `[${i+1}] 오류: ${r.reason?.message}` });
    }
  });
  if (S.loadLog.length > 200) S.loadLog = S.loadLog.slice(-200);
  renderAdminContent();
  const log = document.getElementById('load-log');
  if (log) log.scrollTop = log.scrollHeight;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────

function btn(id, disabled) {
  const el = document.getElementById(id);
  if (el) el.disabled = disabled;
}

function statusPill(status) {
  const s = (status || 'unknown').toLowerCase();
  const map = { running: '실행 중', creating: '시작 중', queued: '대기 중', error: '오류', timeout: '시간 초과', ready: 'Ready', notready: 'NotReady' };
  return `<span class="status status-${s}">${map[s] || s}</span>`;
}

function fmtNum(n) { return n == null || n === '-' ? '-' : Number(n).toLocaleString(); }
function fmtDate(s) { if (!s || s === '-') return '-'; try { return new Date(s).toLocaleString('ko-KR'); } catch { return s; } }
function fmtWait(s) { if (!s) return '-'; const m = Math.floor(s / 60); return m > 0 ? `약 ${m}분` : `${s}초`; }

let toastTimer;
function showToast(msg, type = 'info') {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;padding:0.75rem 1.25rem;border-radius:0.6rem;font-size:0.85rem;font-weight:500;max-width:320px;z-index:999;transition:opacity 0.3s;border:1px solid;';
    document.body.appendChild(el);
  }
  const colors = { success: 'rgba(34,197,94,0.15);color:#22c55e;border-color:rgba(34,197,94,0.3)', error: 'rgba(239,68,68,0.15);color:#ef4444;border-color:rgba(239,68,68,0.3)', info: 'rgba(99,102,241,0.15);color:#6366f1;border-color:rgba(99,102,241,0.3)' };
  el.style.background = colors[type].split(';')[0];
  el.style.cssText += colors[type];
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 3500);
}

// ─── Render ───────────────────────────────────────────────────────────────────

function render() {
  const app = document.getElementById('app');
  if (S.view === 'login') { app.innerHTML = renderLogin(); }
  else if (S.view === 'user')  { app.innerHTML = renderUserPage(); }
  else if (S.view === 'admin') { app.innerHTML = renderAdminPage(); }
  attachListeners();
}

// ── Login ──

function renderLogin() {
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">🧪</div>
        <h1>Jupyter Lab Manager</h1>
        <p>HPA 기반 동적 Pod 관리 시스템</p>
      </div>
      <div id="login-error" style="display:none" class="error-msg"></div>
      <div class="form-group">
        <label class="form-label">사용자명</label>
        <input id="username" class="form-input" type="text" placeholder="admin 또는 사용자명" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input id="password" class="form-input" type="password" placeholder="••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary login-btn" id="btn-login">로그인</button>
    </div>
  </div>`;
}

// ── User Page ──

function renderUserPage() {
  return `
  <header>
    <div class="logo">🧪 Jupyter Lab Manager <span>사용자 포털</span></div>
    <div class="user-info">
      <span style="font-size:0.85rem;color:var(--muted)">${S.username}</span>
      <span class="badge badge-user">User</span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">로그아웃</button>
    </div>
  </header>
  <div class="page" id="user-content">
    <div style="text-align:center;padding:3rem;color:var(--muted)">
      <div class="spinner" style="width:24px;height:24px;border-color:var(--border);border-top-color:var(--primary);display:inline-block"></div>
      <p style="margin-top:1rem">로딩 중...</p>
    </div>
  </div>`;
}

function renderUserContent() {
  const el = document.getElementById('user-content');
  if (!el) return;
  el.innerHTML = buildUserContent();
  attachUserListeners();
  if (S.session && S.session.status !== 'running') startPoll();
}

function buildUserContent() {
  if (!S.session) {
    return `
    <div class="card" style="margin-top:2rem">
      <div class="session-hero">
        <div class="session-icon">📓</div>
        <div class="session-title">아직 세션이 없습니다</div>
        <div class="session-sub">버튼을 눌러 개인 Jupyter Lab을 시작하세요.</div>
        <div class="session-actions">
          <button class="btn btn-primary" id="btn-create">
            <span>▶</span> Jupyter Lab 시작
          </button>
        </div>
      </div>
    </div>`;
  }

  const { session_id, status, access_url, queue_position, estimated_wait_seconds } = S.session;
  const isRunning  = status === 'running';
  const isWaiting  = status === 'queued' || status === 'creating';

  return `
  <div class="card" style="margin-top:2rem">
    <div class="session-hero">
      <div class="session-icon">${isRunning ? '✅' : isWaiting ? '⏳' : '⚠️'}</div>
      <div class="session-title">
        ${isRunning ? 'Jupyter Lab 준비 완료!' : isWaiting ? 'Jupyter Lab 준비 중...' : '세션 상태 확인 필요'}
      </div>
      <div style="margin-bottom:1rem">${statusPill(status)}</div>
      <div class="session-sub" style="font-family:monospace;font-size:0.8rem;color:var(--border)">${session_id}</div>
      ${isWaiting && queue_position ? `
      <dl class="queue-info">
        ${queue_position ? `<dt>대기 순서</dt><dd>${queue_position}번째</dd>` : ''}
        ${estimated_wait_seconds ? `<dt>예상 대기 시간</dt><dd>${fmtWait(estimated_wait_seconds)}</dd>` : ''}
      </dl>` : ''}
      ${isWaiting ? `<div style="margin-top:1.5rem;color:var(--muted);font-size:0.85rem"><span class="spinner"></span> 자동으로 상태를 확인 중입니다...</div>` : ''}
      <div class="session-actions" style="margin-top:1.5rem">
        ${isRunning ? `<a href="${access_url}" target="_blank" rel="noopener" class="btn btn-success">
          <span>🚀</span> Jupyter Lab 열기
        </a>` : ''}
        <button class="btn btn-danger" id="btn-delete">
          <span>🗑</span> 세션 삭제
        </button>
      </div>
    </div>
  </div>`;
}

// ── Admin Page ──

function renderAdminPage() {
  return `
  <header>
    <div class="logo">🧪 Jupyter Lab Manager <span>관리자 콘솔</span></div>
    <div class="user-info">
      <span style="font-size:0.85rem;color:var(--muted)">${S.username}</span>
      <span class="badge badge-admin">Admin</span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">로그아웃</button>
    </div>
  </header>
  <div class="page">
    <div class="tabs" style="margin-top:1.5rem">
      <button class="tab ${S.adminTab==='sessions'?'active':''}" data-tab="sessions">세션</button>
      <button class="tab ${S.adminTab==='nodes'   ?'active':''}" data-tab="nodes">노드</button>
      <button class="tab ${S.adminTab==='pods'    ?'active':''}" data-tab="pods">파드</button>
      <button class="tab ${S.adminTab==='usage'   ?'active':''}" data-tab="usage">Jupyter 현황</button>
      <button class="tab ${S.adminTab==='load'    ?'active':''}" data-tab="load">🔥 부하 테스트</button>
    </div>
    <div id="admin-content"></div>
  </div>`;
}

function renderAdminContent() {
  const el = document.getElementById('admin-content');
  if (!el) return;
  el.innerHTML = buildAdminTabContent();
  attachAdminListeners();
}

function buildAdminTabContent() {
  const tab = S.adminTab;
  if (tab === 'sessions') return buildSessionsTab();
  if (tab === 'nodes')    return buildNodesTab();
  if (tab === 'pods')     return buildPodsTab();
  if (tab === 'usage')    return buildUsageTab();
  if (tab === 'load')     return buildLoadTab();
  return '';
}

function buildSessionsTab() {
  const data = S.adminData.sessions;
  if (!data) return loadingCard();

  const sessions = Object.values(data.sessions || {});
  return `
  <div class="refresh-bar"><span>5초마다 자동 갱신</span></div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">전체 세션</div>
      <div class="stat-value" style="color:var(--primary)">${sessions.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">실행 중</div>
      <div class="stat-value" style="color:var(--success)">${sessions.filter(s=>s.status==='running').length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">대기 중</div>
      <div class="stat-value" style="color:var(--warning)">${sessions.filter(s=>s.status==='queued').length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">시작 중</div>
      <div class="stat-value" style="color:var(--info)">${sessions.filter(s=>s.status==='creating').length}</div>
    </div>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>사용자</th><th>세션 ID</th><th>상태</th><th>파드</th><th>대기순서</th><th>생성시각</th><th>작업</th>
        </tr></thead>
        <tbody>
        ${sessions.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:2rem">세션 없음</td></tr>` :
          sessions.map(s => `<tr>
            <td><strong>${s.username}</strong></td>
            <td style="font-family:monospace;font-size:0.78rem">${s.session_id}</td>
            <td>${statusPill(s.status)}</td>
            <td style="font-family:monospace;font-size:0.78rem">${s.pod_name || '-'}</td>
            <td style="color:var(--warning)">${s.queue_position || '-'}</td>
            <td>${fmtDate(s.created_at)}</td>
            <td>
              <div style="display:flex;gap:0.4rem">
                <button class="btn btn-warning btn-sm admin-stop" data-id="${s.session_id}">중지</button>
                <button class="btn btn-danger btn-sm admin-del" data-id="${s.session_id}">삭제</button>
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function buildNodesTab() {

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">전체 노드</div>

    <div class="stat-card">
      <div class="stat-label">Ready</div>

  <div class="card">
    <div class="table-wrap">

function buildUsageTab() {

  <div class="refresh-bar"><span>5초마다 자동 갱신</span></div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>사용자</th><th>상태</th><th>사용시간(분)</th><th>CPU(m)</th><th>Mem(MiB)</th>

          rows.map(r => `<tr>

function buildLoadTab() {
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start">
    <div class="card">
      <div class="card-title">🔥 CPU 부하 생성 (HPA 테스트)</div>
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem;line-height:1.6">
        <code style="background:var(--surface);padding:0.1rem 0.4rem;border-radius:0.3rem">POST /load/generate</code>로
        피보나치(35) 연산을 실행해 CPU를 끌어올립니다.<br>

      </p>
      <div style="text-align:center;margin-bottom:1.5rem">

      <div style="display:flex;flex-direction:column;gap:0.75rem">
        <button class="btn btn-primary" id="btn-load-1">▶ 단건 요청 (×1)</button>
        <button class="btn btn-warning" id="btn-load-5">⚡ 부하 버스트 (×5)</button>
        <button class="btn btn-danger"  id="btn-load-20">🔥 헤비 버스트 (×20)</button>
        <button class="btn btn-ghost btn-sm" id="btn-load-clear">로그 초기화</button>
      </div>
      <div style="margin-top:1.5rem;padding:1rem;background:var(--surface);border-radius:0.5rem;border:1px solid var(--border);font-size:0.8rem;color:var(--muted)">
        💡 <strong style="color:var(--text)">HPA 확인 방법</strong><br>
        <code style="display:block;margin-top:0.5rem;color:var(--primary)">kubectl get hpa -w</code>
        <code style="display:block;margin-top:0.25rem;color:var(--primary)">kubectl get pods -w</code>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📋 요청 로그</div>
      <div class="load-log" id="load-log">
        ${S.loadLog.length === 0
          ? '<span style="color:var(--border)">아직 요청 없음...</span>'
          : S.loadLog.map(l => `<div><span class="log-ts">${l.ts}</span><span class="${l.ok?'log-ok':'log-err'}">${l.msg}</span></div>`).join('')
        }
      </div>
    </div>
  </div>`;
}

function loadingCard() {
  return `
  <div class="card" style="text-align:center;padding:3rem;color:var(--muted)">
    <div class="spinner" style="width:24px;height:24px;border-color:var(--border);border-top-color:var(--primary);display:inline-block"></div>
    <p style="margin-top:1rem">데이터 로딩 중...</p>
  </div>`;
}

// ─── Event Listeners ──────────────────────────────────────────────────────────

function attachListeners() {
  // Login
  const btnLogin = document.getElementById('btn-login');
  if (btnLogin) {
    const doLogin = async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      if (!username) { errEl.textContent = '사용자명을 입력하세요.'; errEl.style.display = ''; return; }
      btnLogin.disabled = true; btnLogin.textContent = '로그인 중...';
      try {
        const data = await api('POST', '/auth/login', { username, password });
        S.token = data.access_token; S.username = data.username; S.role = data.role;
        S.view = data.frontend_view === 'admin' ? 'admin' : 'user';
        persistAuth();
        render();
        if (S.view === 'user') {
          await loadUserSession();
        } else {
          await loadAdminTab('sessions');
        }
      } catch (e) {
        errEl.textContent = e.message || '로그인에 실패했습니다.';
        errEl.style.display = '';
        btnLogin.disabled = false; btnLogin.textContent = '로그인';
      }
    };
    btnLogin.addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
  }

  // Logout
  const btnLogout = document.getElementById('btn-logout');
  if (btnLogout) btnLogout.addEventListener('click', logout);

  // Admin tabs
  document.querySelectorAll('.tab[data-tab]').forEach(el => {
    el.addEventListener('click', async () => {
      clearTimers();
      S.adminData = {};
      await loadAdminTab(el.dataset.tab);
    });
  });

  // User page - immediate content load
  if (S.view === 'user') {
    loadUserSession();
  }

  // Admin page - immediate tab load
  if (S.view === 'admin' && !document.getElementById('admin-content')?.textContent?.trim()) {
    loadAdminTab(S.adminTab);
  }
}

function attachUserListeners() {
  const btnCreate = document.getElementById('btn-create');
  if (btnCreate) btnCreate.addEventListener('click', createSession);
  const btnDelete = document.getElementById('btn-delete');
  if (btnDelete) btnDelete.addEventListener('click', deleteSession);
}

function attachAdminListeners() {
  document.querySelectorAll('.admin-stop').forEach(el => {
    el.addEventListener('click', () => adminStopSession(el.dataset.id));
  });
  document.querySelectorAll('.admin-del').forEach(el => {
    el.addEventListener('click', () => adminDeleteSession(el.dataset.id));
  });
  const b1  = document.getElementById('btn-load-1');
  const b5  = document.getElementById('btn-load-5');
  const b20 = document.getElementById('btn-load-20');
  const bc  = document.getElementById('btn-load-clear');
  if (b1)  b1.addEventListener('click',  () => generateLoad(1));
  if (b5)  b5.addEventListener('click',  () => generateLoad(5));
  if (b20) b20.addEventListener('click', () => generateLoad(20));
  if (bc)  bc.addEventListener('click',  () => { S.loadCount = 0; S.loadLog = []; renderAdminContent(); });
}

// ─── Boot ─────────────────────────────────────────────────────────────────────

restoreAuth();
render();
</script>
</body>
</html>
