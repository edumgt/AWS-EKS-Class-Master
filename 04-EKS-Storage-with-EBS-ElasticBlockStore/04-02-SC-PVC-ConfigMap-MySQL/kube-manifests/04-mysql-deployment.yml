apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  strategy:
    type: Recreate 
  template: 
    metadata: 
      labels: 
        app: mariadb
    spec: 
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: dbpassword11
          ports:
            - containerPort: 3306
              name: mariadb    
          volumeMounts:
            - name: mariadb-persistent-storage
              mountPath: /var/lib/mysql    
            - name: usermanagement-dbcreation-script
              mountPath: /docker-entrypoint-initdb.d             
      volumes: 
        - name: mariadb-persistent-storage
          persistentVolumeClaim:
            claimName: ebs-mariadb-pv-claim
        - name: usermanagement-dbcreation-script
          configMap:
            name: usermanagement-dbcreation-script
