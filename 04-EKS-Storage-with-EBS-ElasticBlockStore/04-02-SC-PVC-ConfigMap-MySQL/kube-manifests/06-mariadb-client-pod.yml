apiVersion: v1
kind: Pod
metadata:
  name: mariadb-client
  labels:
    app: mariadb-client
spec:
  restartPolicy: Never
  containers:
    - name: mariadb-client
      image: mariadb:11.4
      command:
        - /bin/bash
        - -c
        - |
          echo "=== MariaDB 접속 대기 중 ==="
          until mariadb -h mariadb -uroot -pdbpassword11 -e "SELECT 1" &>/dev/null; do
            echo "MariaDB 준비 중... 재시도"
            sleep 3
          done

          echo "=== test 테이블 생성 ==="
          mariadb -h mariadb -uroot -pdbpassword11 <<'SQL'
          CREATE DATABASE IF NOT EXISTS testdb;
          USE testdb;
          CREATE TABLE IF NOT EXISTS test (
            id  INT AUTO_INCREMENT PRIMARY KEY,
            abc VARCHAR(100) NOT NULL
          );
          SQL

          echo "=== 10건 INSERT ==="
          mariadb -h mariadb -uroot -pdbpassword11 testdb <<'SQL'
          INSERT INTO test (abc) VALUES
            ('data-01'), ('data-02'), ('data-03'), ('data-04'), ('data-05'),
            ('data-06'), ('data-07'), ('data-08'), ('data-09'), ('data-10');
          SQL

          echo "=== SELECT 결과 ==="
          mariadb -h mariadb -uroot -pdbpassword11 testdb -e "SELECT * FROM test;"

          echo "=== 완료 ==="
